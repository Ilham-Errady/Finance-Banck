version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  webserver:
    image: apache/airflow:2.7.1-python3.10
    restart: always
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46ExudM4s-RFZM1_I_f_6B36tKThxR3D3oU4p0M3p4s=
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_secret_key_for_airflow_12345
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./dbt_project:/opt/airflow/dbt_project
      - ~/.dbt:/home/airflow/.dbt
    ports:
      - "8082:8080"
    command: >
      bash -c "pip install dbt-snowflake &&
              airflow db init &&
              airflow users create --username admin --firstname Rime --lastname Errady --role Admin --email admin@example.com --password admin &&
              airflow webserver"

  scheduler:
    image: apache/airflow:2.7.1-python3.10
    restart: always
    depends_on:
      - webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46ExudM4s-RFZM1_I_f_6B36tKThxR3D3oU4p0M3p4s=
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_secret_key_for_airflow_12345
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./dbt_project:/opt/airflow/dbt_project
      - ~/.dbt:/home/airflow/.dbt
    command: >
      bash -c "pip install dbt-snowflake && airflow scheduler"

volumes:
  postgres-db-volume:
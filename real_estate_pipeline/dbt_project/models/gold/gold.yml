version: 2

models:
  - name: dim_customers
    description: "Dimension des clients avec agrégations des soldes et des comptes"
    columns:
      - name: customer_id
        description: "Clé primaire du client"
        tests:
          - unique
          - not_null

  - name: dim_accounts
    description: "Dimension des comptes bancaires"
    columns:
      - name: account_id
        description: "Clé primaire du compte"
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Dimension temporelle pour les analyses décisionnelles"
    columns:
      - name: date_id
        description: "Clé primaire sous format YYYYMMDD"
        tests:
          - unique
          - not_null

  - name: fct_transactions
    description: "Table de faits des transactions bancaires"
    columns:
      - name: transaction_id
        description: "Clé primaire de la transaction"
        tests:
          - unique
          - not_null
      - name: origin_customer_id
        description: "Référence vers le client émetteur"
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

  - name: fct_loans
    description: "Table de faits des prêts bancaires"
    columns:
      - name: loan_id
        description: "Clé primaire du prêt"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Référence vers le client emprunteur"
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id